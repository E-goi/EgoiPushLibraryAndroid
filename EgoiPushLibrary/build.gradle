plugins {
    id 'com.android.library'
    id 'org.jetbrains.dokka'
    id 'com.vanniktech.maven.publish'
    id 'signing'
}

def sdkVersion = "4.2.1"

android {
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        compileSdk 37
        minSdkVersion 23

        aarMetadata {
            minCompileSdk 29
        }

        consumerProguardFiles "consumer-rules.pro"

        buildConfigField("String", "SDK_VERSION", "\"$sdkVersion\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    namespace 'com.egoiapp.egoipushlibrary'
    
    lint {
        targetSdk 36
    }
    
    testOptions {
        targetSdk 36
    }
}

// Explicitly configure signing to use in-memory keys from gradle.properties
signing {
    def keyId = findProperty("signing.keyId")
    def password = findProperty("signing.password")
    def secretKey = findProperty("signing.secretKey")

    if (keyId && secretKey && password) {
        useInMemoryPgpKeys(keyId, secretKey, password)
    }
}

mavenPublishing {
    coordinates("com.egoiapp.egoipushlibrary", "egoipushlibrary", sdkVersion)
    
    pom {
        name = "EgoiPushLibrary"
        description = "Android library responsible for handling notifications from E-goi."
        inceptionYear = "2021"
        url = "https://github.com/E-goi/EgoiPushLibraryAndroid"
        
        licenses {
            license {
                name = "The Apache Software License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        
        developers {
            developer {
                id = "jsilva"
                name = "João Silva"
                email = "jsilva@e-goi.com"
            }
        }
        
        scm {
            url = "https://github.com/E-goi/EgoiPushLibraryAndroid"
            connection = "scm:git:git://github.com/E-goi/EgoiPushLibraryAndroid.git"
            developerConnection = "scm:git:ssh://git@github.com/E-goi/EgoiPushLibraryAndroid.git"
        }
    }

    signAllPublications()
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
